<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cwGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="cwGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0d9488" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="#0b1220" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Interwoven Clinical Weave Heartbeat & Cross -->
  <g filter="url(#glow)">
    <!-- Vertical Medical Pillar Weave -->
    <path d="M32 12 C28 20, 26 26, 26 32 C26 38, 28 44, 32 52 C36 44, 38 38, 38 32 C38 26, 36 20, 32 12 Z" fill="url(#cwGrad1)" opacity="0.95" />
    
    <!-- Horizontal Cross Weave Thread with ECG Pulse Peak -->
    <path d="M12 32 C18 32, 23 32, 27 32 L30 22 L34 42 L37 32 C41 32, 46 32, 52 32" stroke="url(#cwGrad2)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Weave Anchor Node -->
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
    <circle cx="32" cy="32" r="1.5" fill="#0d9488" />
  </g>
</svg>
